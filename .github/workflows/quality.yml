name: Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skylos-advisory:
    name: Skylos Danger Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Skylos
        run: python -m pip install --upgrade pip skylos

      - name: Run Skylos advisory danger scan
        env:
          CI: true
        run: bash src/tools/run_skylos_danger_advisory.sh

  static-quality:
    name: Static Quality Checks (Python ${{ matrix.python-version }})
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The floor (pyproject requires-python) plus the next candidate, so a
        # Python move is continuously rehearsed in CI before the working env
        # follows. tests/test_dependency_sync.py keeps this list honest.
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/.[dev]"
          npm install --ignore-scripts --no-audit --no-fund --prefix src

      - name: Run static quality checks
        env:
          CI: true
        # Validation tests must not rewrite tracked `src/output/` assets; they
        # write generated artifacts to a temp directory.
        run: bash src/tools/run_quality_checks.sh

      - name: Upload static-quality artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: static-quality-artifacts-py${{ matrix.python-version }}
          path: |
            src/output/**
            src/.pytest_cache/**
            src/.coverage*
            src/*.xml
          retention-days: 7

  runtime-smoke:
    name: Runtime Smoke
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/.[dev]"

      - name: Run runtime smoke
        env:
          CI: true
        # Validation tests must not rewrite tracked `src/output/` assets; they
        # write generated artifacts to a temp directory.
        run: bash src/tools/run_runtime_smoke.sh

      - name: Upload runtime-smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: runtime-smoke-artifacts
          path: |
            src/output/**
          retention-days: 7
